<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2563EB">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Jadwal Ruang Meeting</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <style>
    html, body { margin: 0; height: 100%; background: #F8FAFC; overflow: hidden; }
    #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
    #btnPasang { display: none; position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 10;
      background: #2563EB; color: #fff; border: 0; border-radius: 10px; padding: 10px 14px; font: 600 14px system-ui, sans-serif;
      box-shadow: 0 10px 15px -3px rgba(15,23,42,.2); cursor: pointer; }
  </style>
</head>
<body>
  <!-- GANTI URL di bawah dengan URL Web App GAS (berakhiran /exec) -->
  <iframe id="app" src="GANTI_DENGAN_URL_WEB_APP_EXEC" allow="clipboard-write" title="Jadwal Ruang Meeting"></iframe>
  <button id="btnPasang" type="button">Pasang Aplikasi</button>

  <script>
    // Daftarkan service worker (hanya meng-cache cangkang PWA, data tetap dari server)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js').catch(function (e) { console.error('SW gagal:', e); });
      });
    }

    // Tombol pasang ke layar utama (Android / Chrome desktop)
    var installPrompt = null;
    var btn = document.getElementById('btnPasang');
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      installPrompt = e;
      btn.style.display = 'block';
    });
    btn.addEventListener('click', function () {
      if (!installPrompt) return;
      installPrompt.prompt();
      installPrompt.userChoice.then(function () { installPrompt = null; btn.style.display = 'none'; });
    });
    window.addEventListener('appinstalled', function () { btn.style.display = 'none'; });
  </script>
</body>
</html>
